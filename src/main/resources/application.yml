spring:
  application:
    name: movie-service
  datasource:
    url: jdbc:h2:file:./data/movies
  jpa:
    hibernate:
      ddl-auto: validate
  grpc:
    client:
      channel:
        people:
          target: static://localhost:9090
  graphql:
    graphiql:
      enabled: true

server:
  port: 8080
