spring:
  application:
    name: movie-service
  datasource:
    url: jdbc:h2:file:./data/movies
  jpa:
    hibernate:
      ddl-auto: validate
  grpc:
    client:
      channel:
        people:
          target: static://localhost:9090
  graphql:
    graphiql:
      enabled: true
  servlet: # new
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

artwork:
  directory: ./data/artwork
